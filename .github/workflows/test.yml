name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

# Cancel superseded runs on the same branch — saves CI minutes when devs push
# multiple commits in quick succession.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20.x'
  PNPM_VERSION: '10'

jobs:
  # Lint with Biome. Uses lint:ci which runs the non-fixing variant so the
  # job genuinely fails on style/correctness issues rather than silently
  # rewriting committer's code in CI.
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint:ci

  # Strict TypeScript check. Catches type errors before they hit production
  # — this was missing from CI before Week 3.1.
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      # Some types come from the `fumadocs-mdx` postinstall step; running
      # postinstall manually here keeps typecheck reproducible.
      - run: pnpm postinstall
      - run: pnpm typecheck

  # Unit tests. Removed the previous `continue-on-error: true` on coverage —
  # we now want the job to fail when a PR drops below the threshold defined
  # in vitest.config.ts.
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      - name: Upload coverage reports
        if: always()
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  # Production build. Catches Next.js build-time errors that lint+typecheck
  # cannot (route conflicts, MDX issues, image optimization config, etc.).
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          # Build-time env stubs so Next.js can complete static analysis
          # without a real .env file. Replace with actual secrets via
          # repository settings if specific routes need them.
          DATABASE_URL: 'postgresql://stub:stub@localhost:5432/stub'
          BETTER_AUTH_SECRET: 'ci-build-stub-secret'
          NEXT_PUBLIC_BASE_URL: 'https://nano.example.com'

  # Migration health check (Week 3.4 — lightweight variant).
  # Boots a real Postgres container via Actions services, runs the full
  # Drizzle migration sequence against a fresh DB. Catches:
  #   - Migration files that don't apply cleanly (typos, ordering issues,
  #     dropped columns still referenced, etc.)
  #   - Schema drift between schema.ts and the migrations folder
  #
  # Does NOT replace true integration tests (those would assert business
  # logic against the real DB) — that scope stays deferred to Week 8 when
  # staging is up. This job is the cheap "did our schema break?" gate.
  migrations:
    name: Migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: arch_ai_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Apply migrations to fresh DB
        run: pnpm db:migrate
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/arch_ai_ci'
      - name: Verify schema is consistent with migrations
        # `drizzle-kit generate` is a no-op when schema.ts matches the
        # migrations exactly. Anything else means the schema drifted —
        # likely a developer modified schema.ts but forgot to run
        # `pnpm db:generate` to commit the migration. Fail the job to
        # force the discipline.
        run: |
          pnpm db:generate
          if [ -n "$(git status --porcelain src/db/migrations)" ]; then
            echo "::error::Schema drift detected — run 'pnpm db:generate' and commit the resulting migration."
            git --no-pager diff src/db/migrations
            exit 1
          fi
        env:
          DATABASE_URL: 'postgresql://ci:ci@localhost:5432/arch_ai_ci'

  # Playwright smoke tests — verify public routes render without console
  # errors (Week 3.6). Uses production build to match what users actually hit.
  e2e:
    name: E2E (smoke)
    runs-on: ubuntu-latest
    # Only run on PRs to keep main branch CI fast; manual triggers are fine
    # via workflow_dispatch if we add it later.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
        env:
          DATABASE_URL: 'postgresql://stub:stub@localhost:5432/stub'
          BETTER_AUTH_SECRET: 'ci-e2e-stub-secret'
          NEXT_PUBLIC_BASE_URL: 'http://127.0.0.1:3000'
          ALLOW_LOCAL_BASE_URL_IN_PRODUCTION: 'true'
          CRON_SECRET: 'ci-cron-secret'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
